<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	<form>
  <!-- Name -->
  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Name" />

  <!-- Phone Number -->
  <label for="phone">Phone Number</label>
  <input type="text" id="phone" placeholder="Phone Number" />

  <!-- Address -->
  <label for="address">Address</label>
  <input type="text" id="address" placeholder="Address" />

  <!-- Checkbox -->
  <label for="checkbox">Have you ever lived with a Dog before?</label>
  <input type="checkbox" id="checkbox" value="Have you ever lived with a Dog before?" />

  <!-- Multi-select -->
  <label for="multiSelect">Please select your preferred breeds</label>
  <select id="multiSelect" multiple>
    <option value="golden_retriever">Golden Retriever</option>
    <option value="german_shepherd">German Shepherd</option>
    <option value="labrador">Labrador</option>
  </select>

  <!-- Submit Button -->
  <input type="submit" id="submit" value="Submit" />
</form>

</body>

</html>
